name: Deploy to Digital Ocean

# Workflow disabled - using manual deployment
# on:
#   push:
#     branches: [ master ]
#   workflow_dispatch:  # Allow manual trigger
on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Check if backend build cache exists
      - name: Check backend cache availability
        id: backend-cache
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/readnest-backend:buildcache"
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Backend build cache found"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No backend build cache (first build)"
          fi

      # Build and push backend image
      - name: Build and push backend
        uses: docker/build-push-action@v5
        with:
          context: ./back-end
          file: ./back-end/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/readnest-backend:latest,${{ secrets.DOCKERHUB_USERNAME }}/readnest-backend:${{ github.sha }}
          cache-from: ${{ steps.backend-cache.outputs.exists == 'true' && format('type=registry,ref={0}/readnest-backend:buildcache', secrets.DOCKERHUB_USERNAME) || '' }}
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/readnest-backend:buildcache,mode=max

      # Check if frontend build cache exists
      - name: Check frontend cache availability
        id: frontend-cache
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/readnest-frontend:buildcache"
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Frontend build cache found"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No frontend build cache (first build)"
          fi

      # Build and push frontend image
      - name: Build and push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./front-end
          file: ./front-end/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/readnest-frontend:latest,${{ secrets.DOCKERHUB_USERNAME }}/readnest-frontend:${{ github.sha }}
          cache-from: ${{ steps.frontend-cache.outputs.exists == 'true' && format('type=registry,ref={0}/readnest-frontend:buildcache', secrets.DOCKERHUB_USERNAME) || '' }}
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/readnest-frontend:buildcache,mode=max

      # Set up SSH for deployment
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Deploy to Digital Ocean
      - name: Deploy to Digital Ocean
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.DO_USERNAME }}@${{ secrets.DO_HOST }} << 'ENDSSH'
            set -e
            cd /root/4-final-random_grandeeism || { mkdir -p /root/4-final-random_grandeeism && cd /root/4-final-random_grandeeism; }
            
            # Create .env if it doesn't exist
            if [ ! -f .env ]; then
              cat > .env << 'EOF'
          DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}
          NODE_ENV=production
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          PORT=7001
          USE_MOCK_DB=false
          EOF
            fi
            
            # Pull latest images
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/readnest-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/readnest-frontend:latest
            
            # Stop and remove old containers
            docker stop readnest-backend readnest-frontend 2>/dev/null || true
            docker rm readnest-backend readnest-frontend 2>/dev/null || true
            
            # Create network if it doesn't exist
            docker network inspect readnest-network >/dev/null 2>&1 || docker network create readnest-network
            
            # Start backend
            docker run -d \
              --name readnest-backend \
              --network readnest-network \
              --restart unless-stopped \
              -p 7001:7001 \
              -e NODE_ENV=production \
              -e PORT=7001 \
              -e MONGODB_URI="${{ secrets.MONGODB_URI }}" \
              -e JWT_SECRET="${{ secrets.JWT_SECRET }}" \
              -e USE_MOCK_DB=false \
              ${{ secrets.DOCKERHUB_USERNAME }}/readnest-backend:latest
            
            # Start frontend
            docker run -d \
              --name readnest-frontend \
              --network readnest-network \
              --restart unless-stopped \
              -p 80:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/readnest-frontend:latest
            
            # Wait for services to start
            sleep 10
            
            # Check container status
            docker ps --filter "name=readnest" --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
            
            # Clean up old images
            echo "🧹 Cleaning up old images..."
            docker image prune -af
            
            echo "✅ Deployment completed"
          ENDSSH

      # Verify deployment
      - name: Verify deployment
        run: |
          sleep 15
          curl -f http://${{ secrets.DO_HOST }}/health || exit 1
          echo "✅ Deployment verified successfully!"

